# /etc/nginx/nginx.conf

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    # --------------------------------------------------------------------------
    # MIME TYPES & DEFAULTS
    # --------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    types {
        application/wasm                     wasm;
        application/octet-stream             unityweb bundle bin;
        application/manifest+json            webmanifest;
    }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # --------------------------------------------------------------------------
    # SECURITY HARDENING
    # --------------------------------------------------------------------------

    # Hide NGINX version in response headers and error pages.
    server_tokens off;

    # --------------------------------------------------------------------------
    # GLOBAL SSL/TLS HARDENING (Inherited by all Server Blocks)
    # --------------------------------------------------------------------------
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20";
    ssl_prefer_server_ciphers on;

    # OCSP Stapling (faster TLS handshakes, requires valid cert chain).
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # --------------------------------------------------------------------------
    # PERFORMANCE
    # --------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Default request body limit (reject oversized payloads on API routes).
    # Individual locations can override this (e.g. patch download sets 0).
    client_max_body_size 1k;

    # Limit header/body buffer sizes to mitigate slowloris and oversized-header attacks.
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/wasm;

    # --------------------------------------------------------------------------
    # DDOS / RATE LIMITING
    # --------------------------------------------------------------------------

    # API discovery endpoints (loginserver, latest_version).
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=10r/s;

    # Patch download (lower rate — large file transfers get a generous burst).
    limit_req_zone  $binary_remote_addr zone=patch_limit:10m rate=2r/s;

    # WebGL static asset serving.
    limit_req_zone  $binary_remote_addr zone=webgl_limit:10m rate=30r/s;

    # Per-IP connection limits.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Return 429 Too Many Requests instead of the default 503.
    limit_req_status  429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # UPSTREAM DEFINITIONS (Backend Servers — all localhost-only via Kestrel)
    # --------------------------------------------------------------------------

    # WebGL static asset server (Kestrel, port 8000)
    upstream web_client_server {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # IPFetch server: login server discovery (Kestrel, port 8080)
    upstream ipfetch_server {
        server 127.0.0.1:8080;
        keepalive 4;
    }

    # Patcher server: version check + patch download (Kestrel, port 8090)
    upstream patcher_server {
        server 127.0.0.1:8090;
        keepalive 16;
    }

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # GAME SERVER PORT-TO-BACKEND MAPPING
    # --------------------------------------------------------------------------
    # Maps each game server port to its backend IP address.
    # Supports local, LAN, and remote/cloud server instances.
    # The port is extracted from the URL path: wss://game.fishmmo.com/ws/{port}
    #
    # To add a server:  add its port + IP here, then `nginx -s reload`.
    # To move a server:  change the IP for its port, then `nginx -s reload`.
    # Default (127.0.0.1) covers single-machine and dev setups with no entries.
    #
    # NOTE: For remote/public IPs, ensure the NGINX→backend hop is protected
    #       by a VPN or private network (e.g., WireGuard, Tailscale, AWS VPC)
    #       since the internal proxy hop is plain HTTP.
    # --------------------------------------------------------------------------
    map $backend_port $backend_address {
        default       127.0.0.1;          # fallback for local/dev servers

        # Login Servers
        # 7770        192.168.1.10;       # Login Server A (example)

        # World Servers
        # 7780        192.168.1.10;       # World Server A (example)

        # Scene Servers
        # 7790        192.168.1.10;       # Scene Server A (example)
        # 7791        192.168.1.11;       # Scene Server B (example)
    }

    # Default proxy timeouts.
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # --------------------------------------------------------------------------
    # SERVER BLOCKS (fishmmo.com Subdomains)
    # --------------------------------------------------------------------------

    # 1. WEBGL CLIENT (play.fishmmo.com)
    server {
        listen 443 ssl;
        http2 on;
        server_name play.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        # Security headers.
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        limit_conn conn_limit 20;

        location / {
            limit_req zone=webgl_limit burst=60 nodelay;

            # Enable buffering for static assets (improves throughput).
            proxy_buffering on;

            # Enable keepalive to upstream.
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_pass http://web_client_server;
        }
    }

    # 2. API GATEWAY (api.fishmmo.com)
    #    Routes IPFetch and Patcher endpoints to their respective backends.
    #    Internal hop is plain HTTP over loopback — SSL is terminated here.
    server {
        listen 443 ssl;
        http2 on;
        server_name api.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        # Security headers.
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Per-IP connection limit for all API endpoints.
        limit_conn conn_limit 10;

        # Enable keepalive to upstreams.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- IPFetch endpoint (login server discovery) ---

        location /loginserver {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ipfetch_server/loginserver;
        }

        # --- Patcher endpoints (version check and patch download) ---

        location /latest_version {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://patcher_server/latest_version;
        }

        # Match patch download URLs like /1.2.3 or /1.2.3.alpha
        location ~ "^/\d+\.\d+\.\d+(\.[a-zA-Z0-9]+)?$" {
            limit_req  zone=patch_limit burst=3 nodelay;
            limit_conn conn_limit 3;

            proxy_buffering         off;
            proxy_request_buffering off;
            client_max_body_size    0;
            proxy_read_timeout      300s;

            proxy_pass http://patcher_server;
        }

        location / { return 404; }
    }

    # 3. GAME SERVER WEBSOCKETS (game.fishmmo.com)
    #    Dynamic port-based routing: wss://game.fishmmo.com/ws/{port}
    #    Supports any number of Login, World, and Scene server instances.
    #    NGINX extracts the port from the URL path and resolves the backend
    #    address via the $backend_port → $backend_address map above.
    #    Allowed port range: 7770–7899 (130 server slots).
    #    Adjust the regex range if your cluster needs more ports.

    server {
        listen 443 ssl;
        server_name game.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        limit_conn conn_limit 5;

        # Dynamic WebSocket proxy: /ws/{port}
        # Port range whitelisted to 7770-7899 via regex.
        #   77[7-9][0-9] matches 7770-7799
        #   78[0-9][0-9] matches 7800-7899
        location ~ "^/ws/(77[7-9][0-9]|78[0-9]{2})$" {
            set $backend_port $1;

            proxy_pass http://$backend_address:$backend_port;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Reject anything outside the /ws/{port} pattern.
        location / { return 444; }
    }

    # Catch-all: reject requests for unknown subdomains.
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        return 444;  # Close connection with no response.
    }

    # Global HTTP → HTTPS redirect.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge for certificate renewal.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}