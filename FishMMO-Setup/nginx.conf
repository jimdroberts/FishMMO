# /etc/nginx/nginx.conf
# FishMMO — WebTransport (QUIC/HTTP3) architecture.
# HTTP API + WebGL static content served through the http block.
# Game traffic (UDP) forwarded through the stream block at Layer 4.
# NGINX does NOT terminate TLS for game traffic — each game server
# terminates its own QUIC/TLS with PEM certificates.
#
# WebSocket proxy support is intentionally absent:
#   - All persistent game communication uses UDP/QUIC, not WebSocket.
#   - The HTTP API (api.fishmmo.com) is stateless REST — no connection upgrade required.
#   - The WebGL client uses native WebTransport (QUIC) to connect to game servers directly,
#     bypassing nginx entirely at Layer 7.
#   - If a future feature requires WebSocket support (e.g., a browser-based chat client),
#     add proxy_set_header Upgrade $http_upgrade and proxy_set_header Connection "upgrade"
#     in the relevant location block.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

# ═══════════════════════════════════════════════════════════════
# IPv6 SUPPORT
# ═══════════════════════════════════════════════════════════════
# This server is currently configured for IPv4-only in several
# areas.  Below are the steps to enable full IPv6 dual-stack:
#
#  1. Main context (this file): Ensure user/worker_processes need
#     no changes — IPv6 is a transport concern, not process-level.
#
#  2. Stream block (Layer 4 — game UDP, ports 7770-7999):
#     Each generated config in /etc/nginx/stream.d/*.conf now
#     includes a commented-out IPv6 listen directive.  To enable,
#     uncomment the following line in the port config:
#       listen [::]:PORT udp;
#     Also:
#     - Add AAAA records for game.fishmmo.com pointing to the
#       server's IPv6 address.
#
#  3. HTTP block (Layer 7 — API + WebGL):
#     Most server blocks already include  listen [::]:443 ssl;
#     (play.fishmmo.com, api.fishmmo.com, game.fishmmo.com,
#     catch-all, redirect).  Verify all server blocks in the http
#     section have the equivalent IPv6 listen directive.
#
#  4. TCP/80 redirect (Let's Encrypt ACME):
#     Already listens on [::]:80 — no change needed.
#
#  WARNINGS:
#     - Some cloud providers charge extra for IPv6 traffic; check
#       your provider's billing model before enabling.
#     - Test with an IPv6-only client (e.g., mobile network
#       tethering) after enabling to confirm full connectivity.
#     - Dual-stack (IPv4 + IPv6) is the safest deployment;
#       IPv6-only is not recommended unless all upstream
#       dependencies (database, SMTP relay, patch CDN, etc.)
#       are also reachable over IPv6.
# ═══════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════
# LAYER 4: Game Server UDP Stream Forwarding
# ═══════════════════════════════════════════════════════════════
# NGINX forwards raw UDP packets to loopback game servers.
# No TLS termination, no protocol inspection, no path routing.
# The game server sees source 127.0.0.1 — the real client IP
# is recovered via a one-time connection token from the HTTP API.
#
# Port-to-backend configs are auto-generated by:
#   /usr/local/bin/gen-fishmmo-stream-config.sh
# Individual configs live in /etc/nginx/stream.d/*.conf
# Reload with: nginx -s reload  (zero-downtime, no dropped connections)
#
# PROXY_TIMEOUT — UDP SESSION IDLE TIMEOUT:
# The generated stream configs (stream.d/*.conf) set proxy_timeout to
# ${PROXY_TIMEOUT:-30s} (default 30 seconds, configurable via environment
# variable).  This controls how long nginx keeps a UDP session mapping
# alive after the last packet.  If this value is larger than the game
# server's idle disconnect threshold, nginx will hold the session mapping
# open after the server has already freed the connection, wasting memory
# and file descriptors on the nginx side.
#
# The FishMMO game server's idle timeout is defined by StaleSceneTimeout
# in the game .cfg files (default 5 seconds).  The proxy_timeout of 30s
# provides a generous margin for in-flight keepalives and clock skew.
# If you change StaleSceneTimeout in the game config, adjust PROXY_TIMEOUT
# accordingly so that proxy_timeout >= StaleSceneTimeout + margin.
# ═══════════════════════════════════════════════════════════════
#
# HEALTH CHECKING: The stream module has NO health checking at all —
# not even passive health checks.  nginx does not track upstream
# failures at Layer 4 for UDP streams.  If a game server process
# crashes, nginx continues forwarding UDP datagrams to the dead
# upstream until the stream config is updated and reloaded.
#
# The following options exist for external health monitoring:
#
#   Option A: systemd timer (recommended for systemd deployments)
#   ─────────────────────────────────────────────────────────────
#   Create a service that probes each upstream with a custom UDP
#   health probe (e.g., a simple script using nping or socat) and
#   removes dead upstreams from stream.d/*.conf, then reloads nginx.
#
#     /etc/systemd/system/fishmmo-healthcheck.service:
#       [Service]
#       Type=oneshot
#       ExecStart=/usr/local/bin/fishmmo-healthcheck.sh
#
#     /etc/systemd/system/fishmmo-healthcheck.timer:
#       [Timer]
#       OnCalendar=*:0/1           # every minute
#       Persistent=true
#
#   Option B: cron job (simplest)
#   ─────────────────────────────
#   Add a crontab entry that runs a health-check script every minute:
#     * * * * * /usr/local/bin/fishmmo-healthcheck.sh
#
#   Option C: Consul / service mesh
#   ────────────────────────────────
#   Deploy a Consul sidecar per game server and use Consul Template
#   to dynamically generate stream.d/*.conf from service health.
#
#   Example health-check script skeleton (fishmmo-healthcheck.sh):
#     for port in 7770 7780 7790; do
#       if ! socat - UDP4:127.0.0.1:$port,connect-timeout=2 </dev/null; then
#         echo "Server on port $port is down, removing from stream config..."
#         rm -f "/etc/nginx/stream.d/$port.conf"
#       fi
#     done
#     nginx -t && nginx -s reload
#
# PER-IP RATE LIMITING: The stream module currently applies
# per-session bandwidth limits of 100 MB/s (upload and download)
# set in the generated port configs, but there is NO per-IP rate
# limiting at the stream layer — a single abusive client can
# consume all available upstream bandwidth.
#
#   Recommendations:
#     - Use iptables/nftables hashlimit rules for per-IP UDP rate
#       limiting before traffic reaches nginx.
#     - Example iptables rule for per-IP rate limiting on game ports:
#         iptables -A INPUT -p udp --dport 7770:7999 \
#           -m hashlimit --hashlimit-name game_ratelimit \
#           --hashlimit-mode srcip --hashlimit-srcmask 32 \
#           --hashlimit-above 1000/second --hashlimit-burst 2000 \
#           --hashlimit-htable-expire 60000 -j DROP
#     - For more sophisticated protection, consider an external
#       DDoS mitigation service (Cloudflare, AWS Shield, etc.).

# ═══════════════════════════════════════════════════════════════════════
# PER-IP RATE LIMITING (UDP STREAM LAYER)
# ═══════════════════════════════════════════════════════════════════════
# NGINX's stream module does NOT support per-IP rate limiting.  The
# per-session bandwidth limits configured in the generated port configs
# cap overall throughput per connection, but a single abusive source IP
# can open many concurrent sessions and consume all upstream bandwidth.
#
# RECOMMENDATION: Apply per-IP UDP rate limiting BEFORE traffic reaches
# nginx, using iptables or nftables on the host.
#
# ── iptables (legacy, widely available) ────────────────────────────
# Limit each source IP to 1000 packets/second (burst 2000) on game
# UDP ports.  Adjust --hashlimit-above and --hashlimit-burst to match
# your expected per-client traffic profile.
#
#   iptables -A INPUT -p udp --dport 7770:7999 \
#     -m hashlimit --hashlimit-name game_ratelimit \
#     --hashlimit-mode srcip --hashlimit-srcmask 32 \
#     --hashlimit-above 1000/second --hashlimit-burst 2000 \
#     --hashlimit-htable-expire 60000 -j DROP
#
# To also limit per source IP *and* destination port (stricter):
#
#   iptables -A INPUT -p udp --dport 7770:7999 \
#     -m hashlimit --hashlimit-name game_ratelimit_per_port \
#     --hashlimit-mode srcip,dstport --hashlimit-srcmask 32 \
#     --hashlimit-above 500/second --hashlimit-burst 1000 \
#     --hashlimit-htable-expire 60000 -j DROP
#
# To persist rules across reboots, install iptables-persistent:
#   apt-get install iptables-persistent   # Debian/Ubuntu
#   netfilter-persistent save
#
# ── nftables (modern replacement, preferred) ───────────────────────
# Create a named set and rate-limit each source IP:
#
#   nft add table inet fishmmo_filter
#   nft add chain inet fishmmo_filter input { type filter hook input priority 0\; policy accept\; }
#   nft add rule inet fishmmo_filter input udp dport 7770-7999 \
#       ct state new limit rate 1000/second burst 2000 accept
#   nft add rule inet fishmmo_filter input udp dport 7770-7999 drop
#
# To persist: nft list ruleset > /etc/nftables.conf
#
# ── Monitoring ─────────────────────────────────────────────────────
# Watch rate-limit hits in real time (iptables):
#   watch -n1 'iptables -L -v -n | grep hashlimit'
# Or (nftables):
#   watch -n1 'nft list chain inet fishmmo_filter input'
#
# ── External DDoS Mitigation ───────────────────────────────────────
# For production deployments under sustained attack, consider a
# dedicated DDoS mitigation service in front of your infrastructure:
#   - Cloudflare Spectrum (UDP proxy with built-in DDoS protection)
#   - AWS Shield Advanced
#   - Google Cloud Armor
# ═══════════════════════════════════════════════════════════════════════

stream {
    log_format game_udp '$remote_addr [$time_local] $protocol '
                        '$bytes_sent $bytes_received '
                        '$session_time "$upstream_addr"';

    access_log /var/log/nginx/game_udp_access.log game_udp;
    # NOTE: Configure logrotate for game UDP access logs (see http block for example config).

    # Include per-port configs (generated by deployment script)
    include /etc/nginx/stream.d/*.conf;

    # ── IPv6 GAP ──────────────────────────────────────────────
    # The stream block above listens on IPv4 only.  IPv6 game
    # traffic (UDP ports 7770-7999) is NOT currently accepted.
    # This is a known gap — all in-production game servers are
    # reached via IPv4.
    #
    # Steps to enable IPv6 for game traffic:
    #   1. Add listen [::]:PORT udp reuseport; to each generated
    #      config in /etc/nginx/stream.d/*.conf (or extend
    #      gen-fishmmo-stream-config.sh to emit them).
    #   2. Add AAAA records for game.fishmmo.com pointing to the
    #      server's IPv6 address.
    #   3. Verify IPv4-mapped IPv6 clients work (dual-stack).
    #      WARNING: Some cloud providers charge extra for IPv6
    #      traffic — check your provider's billing model.
    #   4. Test with an IPv6-only client (e.g. tether to a mobile
    #      network) to ensure connectivity. QUIC handshakes from
    #      IPv6-only clients will be silently dropped until the
    #      listen directives above are added.
}

# ═══════════════════════════════════════════════════════════════
# LAYER 7: HTTP (TLS-terminated API + static content)
# ═══════════════════════════════════════════════════════════════

http {
    # ── MIME TYPES & DEFAULTS ──────────────────────────────────
    include       /etc/nginx/mime.types;
    types {
        application/wasm                     wasm;
        application/octet-stream             unityweb bundle bin;
        application/manifest+json            webmanifest;
    }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    # NOTE: These access logs grow unboundedly. Configure logrotate (or equivalent) to
    # rotate, compress, and eventually remove old logs. Example logrotate config:
    #   /var/log/nginx/*.log {
    #       daily
    #       rotate 14
    #       compress
    #       delaycompress
    #       missingok
    #       notifempty
    #       postrotate
    #           systemctl reload nginx || true
    #       endscript
    #   }

    # ── SECURITY HARDENING ─────────────────────────────────────
    server_tokens off;

    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_protocols             TLSv1.2 TLSv1.3;
    # NOTE: TLS 1.2 is still permitted for compatibility with older clients (e.g.
    # Windows 7, Android 5-7, some embedded game consoles). PCI DSS 4.0 mandates
    # that TLS 1.2 be phased out by March 2025 for new integrations and by March
    # 2028 for existing integrations, in favor of TLS 1.3. Plan to remove TLS 1.2
    # once legacy client support is no longer required.
    ssl_ciphers               "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20";
    ssl_prefer_server_ciphers on;

    ssl_ecdh_curve          X25519:prime256v1;  # prefer modern ECDH curves for forward secrecy

    ssl_stapling        on;
    ssl_stapling_verify on;
    # WARNING: These DNS resolvers (Cloudflare 1.1.1.1 and Google 8.8.8.8) may be
    # blocked or unreachable in some networks, including:
    #   - China (Great Firewall of China blocks both)
    #   - Corporate firewalls with strict DNS policies
    #   - Networks using DNS-based content filtering
    # If OCSP stapling fails, clients will silently fall back to OCSP fetching
    # (which adds latency and a privacy leak). Replace these with local resolvers
    # if deploying in an environment where these public resolvers are unavailable.
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── PERFORMANCE ────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    # Default nginx client_max_body_size: 1m is too restrictive for POST requests
    # (e.g. API calls with JSON payloads, patcher metadata requests).
    # 64k handles reasonable request bodies while still providing protection
    # against overly large uploads. The per-location override for the patch
    # download endpoint (client_max_body_size 0; unlimited) still applies.
    client_max_body_size 64k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;  # Compress proxied responses; already-compressed types excluded via gzip_types
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/wasm;

    # ── DDoS / RATE LIMITING ───────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=patch_limit:10m rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=webgl_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── UPSTREAM DEFINITIONS ───────────────────────────────────
    #
    # Health-check note:
    #   All upstream blocks below rely on PASSIVE health checks only —
    #   nginx marks a server as down after max_fails=3 failures within
    #   fail_timeout=30s and stops sending requests to it.  This is
    #   sufficient to detect a fully crashed process, but it does NOT
    #   detect degraded servers (e.g., hung due to a deadlock while the
    #   TCP port is still open) until a request actually fails.
    #
    #   ACTIVE health checks (periodic probes independent of live traffic)
    #   require one of:
    #     - nginx Plus (commercial) — the `health_check` directive in the
    #       location block, plus the `zone` directive in the upstream block.
    #     - The open-source third-party `ngx_http_upstream_check_module`
    #       (not included in most distribution packages; custom build).
    #
    #   Recommendation for production:
    #     Either switch to nginx Plus for built-in active health checks,
    #     or deploy a sidecar health-checker (e.g., a small cron job or
    #     systemd timer that curls each backend's /healthz endpoint and
    #     removes/re-adds the server via the nginx API).  For low-traffic
    #     deployments the passive checks below are adequate.
    upstream web_client_server {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream ipfetch_server {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream patcher_server {
        server 127.0.0.1:8090 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── PROXY DEFAULTS ─────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ═══════════════════════════════════════════════════════════
    # 1. WEBGL CLIENT (play.fishmmo.com)
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl;
        http2 on;
        # HTTP/3 (QUIC) for WebTransport and static content delivery.
        #
        # REQUIREMENT: nginx must be compiled with the --with-http_v3_module configure
        # flag. Most distribution packages (nginx-mainline on Arch, nginx-full on
        # Debian/Ubuntu) include it, but the default nginx package on some distros
        # does NOT. Verify with: nginx -V 2>&1 | grep http_v3_module
        #
        # If http_v3_module is not available, comment out both this listen directive
        # AND the Alt-Svc header further down. Then run: nginx -t && nginx -s reload
        listen 443 quic reuseport;
        server_name play.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # connect-src: https:// covers browser WebTransport (QUIC/HTTP3), which is
        # the only gameplay transport. There is deliberately no wss:// grant — the
        # WebSocket transport was retired and nothing in the client speaks it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; connect-src 'self' https://game.fishmmo.com:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Alt-Svc advertises HTTP/3 support. Comment out this header if the QUIC
        # listener above is also commented out (http_v3_module not available).
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1';

        limit_conn conn_limit 20;

        location / {
            limit_req zone=webgl_limit burst=60 nodelay;

            proxy_buffering on;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_pass http://web_client_server;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # 2. API GATEWAY (api.fishmmo.com)
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl;
        http2 on;
        server_name api.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://api.fishmmo.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Access-Control-Allow-Origin "https://play.fishmmo.com" always;
        add_header Vary "Origin" always;

        limit_conn conn_limit 10;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Strip backend CORS headers — nginx adds its own below.
        # If the ASP.NET app also adds CORS headers, this prevents duplicates.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # --- IPFetch endpoint (login server discovery + connection token) ---
        location /loginserver {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ipfetch_server/loginserver;
        }

        # --- Patcher endpoints ---
        location /latest_version {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://patcher_server/latest_version;
        }

        location ~ "^/\d+\.\d+\.\d+(\.[a-zA-Z0-9]+)?$" {
            limit_req  zone=patch_limit burst=3 nodelay;
            limit_conn conn_limit 3;
            proxy_buffering         off;
            proxy_request_buffering off;
            client_max_body_size    0;
            proxy_read_timeout      300s;
            proxy_pass http://patcher_server;
        }

        location / { return 404; }
    }

    # ═══════════════════════════════════════════════════════════
    # 3. GAME HOST (game.fishmmo.com) — DNS ONLY
    # ═══════════════════════════════════════════════════════════
    # The game.fishmmo.com DNS record points to this server's IP.
    # Game traffic uses UDP ports 7770-7999, handled by the
    # stream {} block above (Layer 4 UDP forwarding).
    #
    # TCP/443 on game.fishmmo.com returns 444 (close). This is intentional:
    # the game.fishmmo.com hostname exists solely for game traffic (UDP/QUIC
    # forwarded at Layer 4). No HTTP, no WebSocket, no HTTPS content is served
    # on this hostname. The TCP/443 listener with return 444 ensures that any
    # stray HTTP/HTTPS requests hitting this hostname are silently dropped
    # rather than producing confusing error pages.

    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl;
        server_name game.fishmmo.com;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        return 444;  # Close — no HTTP on game host
    }

    # ── CATCH-ALL ──────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/fishmmo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fishmmo.com/privkey.pem;

        return 444;
    }

    # ── HTTP → HTTPS REDIRECT ──────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}