# FishMMO Production Docker Compose
# ===================================
# Orchestrates the full FishMMO server stack.
#
# Prerequisites:
#   1. Copy .env.example to fishmmo-secrets.env and fill in values.
#   2. Ensure Docker and Docker Compose v2 are installed.
#   3. Build the FishMMO Docker images (see each service's build context).
#
# Usage:
#   docker compose --env-file fishmmo-secrets.env up -d
#   docker compose --env-file fishmmo-secrets.env down
#   docker compose --env-file fishmmo-secrets.env logs -f
#
# Secrets are loaded from fishmmo-secrets.env — NEVER commit that file.
# See .env.example for the full list of required variables.
#
# ── CENTRALIZED LOGGING ────────────────────────────────────────────
# All services use the "json-file" Docker logging driver with size
# limits and rotation.  This is adequate for a single-node deployment.
#
# For multi-node or production-observability setups, consider:
#   1. Log shipping: Add a log shipper sidecar (Fluentd, Logstash,
#      Vector) to each node that forwards logs to a central store
#      (Elasticsearch, Loki, Grafana Cloud).
#   2. Docker logging driver: Switch to a centralized driver at the
#      daemon level (journald, gelf, syslog, fluentd) and configure
#      log aggregation externally.
#   3. Structured logging: Ensure each service emits structured logs
#      (JSON) so they can be parsed and indexed easily.
#   4. Monitoring: Set up log-based alerts (error rate spikes,
#      authentication failures, crash loops) via your aggregation
#      platform.
#
# ── HIGH AVAILABILITY NOTE ──────────────────────────────────────────
# nginx is currently a single point of failure (SPOF) in this stack.
# See comment at the nginx service definition for HA recommendations.
# ────────────────────────────────────────────────────────────────────

version: "3.9"

volumes:
  postgres_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  game_logs:
    driver: local
  certbot_data:
    driver: local

networks:
  fishmmo_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    internal: true
  fishmmo_public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

services:

  # ═════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: fishmmo-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      fishmmo_internal:
        aliases:
          - postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: fishmmo
      POSTGRES_USER: ${POSTGRES_USER:-fishmmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishmmo} -d fishmmo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "log_min_duration_statement=500"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # Database Migrator (one-shot)
  # NOTE: This runs on every `docker compose up`. All EF Core migrations
  # MUST be idempotent — use IF NOT EXISTS guards in seed data and ensure
  # Up() methods can be re-run safely against an already-migrated database.
  # ═════════════════════════════════════════════════════════════════
  db-migrator:
    image: fishmmo/db-migrator:latest
    container_name: fishmmo-db-migrator
    build:
      context: ../FishMMO-Database/FishMMO-DB-Migrator
      dockerfile: Dockerfile
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - fishmmo_internal
    environment:
      ConnectionStrings__NpgsqlConnection: ${ConnectionStrings__NpgsqlConnection}
      FISHMMO_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # IP Fetch Server (ASP.NET — Login Server Discovery)
  # ═════════════════════════════════════════════════════════════════
  ipfetch-server:
    image: fishmmo/ipfetch-server:latest
    container_name: fishmmo-ipfetch
    build:
      context: ../FishMMO-WebServers/IPFetchASP.NET/IpFetchServer
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      fishmmo_internal:
        aliases:
          - ipfetch
      fishmmo_public: {}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__NpgsqlConnection: ${ConnectionStrings__NpgsqlConnection}
      FISHMMO_ENVIRONMENT: Production
      FISHMMO_CLIENT_GATE_SECRET: ${FISHMMO_CLIENT_GATE_SECRET}
      FISHMMO_CONNECTION_TOKEN_HMAC_KEY_BASE64: ${FISHMMO_CONNECTION_TOKEN_HMAC_KEY_BASE64}
      WebServer__HttpPort: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # nginx Reverse Proxy
  # ═════════════════════════════════════════════════════════════════
  # !!! SINGLE POINT OF FAILURE !!!
  # This is the only nginx instance in the stack.  If it goes down:
  #   - All game traffic (UDP/QUIC) is dropped — clients cannot reach
  #     any game server.
  #   - The HTTP API (login discovery, patcher) becomes unavailable.
  #   - WebGL client downloads are blocked.
  #
  # For high-availability in production, consider:
  #   1. Multi-instance: Run two or more nginx containers behind a
  #      cloud load balancer (ALB/NLB on AWS, GLB on GCP, Azure LB).
  #      Each instance forwards to the same game server backends.
  #   2. Keepalived + VRRP: Deploy a floating IP between two nginx
  #      hosts.  One is active, the other takes over on failure.
  #      Requires host-level keepalived configuration outside Docker.
  #   3. DNS round-robin: Use multiple A records for game.fishmmo.com
  #      pointing to different nginx hosts.  Clients retry QUIC on
  #      other addresses if the first is unreachable (QUIC supports
  #      connection migration, but the client must attempt it).
  #   4. Cloud LB: For cloud deployments, place an external load
  #      balancer (NLB for UDP, ALB for HTTP) in front of nginx.
  #      This also provides DDoS protection and SSL termination options.
  #
  # If you implement HA nginx, ensure the game server port ranges
  # (7770-7999) are forwarded from each nginx instance to the same
  # backends, and that the stream.d/*.conf configs are synchronized
  # across instances (e.g., via shared volume or config management).
  # ═════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    container_name: fishmmo-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      fishmmo_internal:
        aliases:
          - nginx
      fishmmo_public: {}
    ports:
      # HTTP/HTTPS for API, patcher, and WebGL content
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC) for WebGL client
      # Game server UDP ports forwarded through nginx stream proxy.
      # Each game server needs its own port; the ranges below support:
      #   7770-7779: Login Servers (up to 10 instances)
      #   7780-7789: World Servers (up to 10 instances)
      #   7790-7999: Scene Servers (up to 210 instances)
      # Only ports actually in use consume kernel resources; unused
      # ports in the range have negligible overhead.
      - "7770-7779:7770-7779/udp"
      - "7780-7789:7780-7789/udp"
      - "7790-7999:7790-7999/udp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - nginx_certs:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - ipfetch-server
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ═════════════════════════════════════════════════════════════════
  # Login Server (Placeholder)
  # ═════════════════════════════════════════════════════════════════
  login-server:
    image: fishmmo/login-server:latest
    container_name: fishmmo-login
    build:
      context: ../FishMMO-Auth/FishMMO-ServerAuth
      dockerfile: Dockerfile
    profiles:
      - all
      - game-servers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      fishmmo_internal:
        aliases:
          - loginserver
    ports:
      - "127.0.0.1:7770:7770/udp"
    volumes:
      - game_logs:/var/log/fishmmo
      - nginx_certs:/etc/fishmmo/certs:ro
    environment:
      ConnectionStrings__NpgsqlConnection: ${ConnectionStrings__NpgsqlConnection}
      FISHMMO_ENVIRONMENT: Production
      FISHMMO_CLIENT_GATE_SECRET: ${FISHMMO_CLIENT_GATE_SECRET}
      FISHMMO_SIGNING_KEY_KEK_BASE64: ${FISHMMO_SIGNING_KEY_KEK_BASE64}
      FISHMMO_SMTP_PASSWORD: ${FISHMMO_SMTP_PASSWORD}
      ServerName: LoginServer
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # World Server (Placeholder)
  # ═════════════════════════════════════════════════════════════════
  world-server:
    image: fishmmo/world-server:latest
    container_name: fishmmo-world
    build:
      context: ../FishMMO-Unity
      dockerfile: Dockerfile.world
    profiles:
      - all
      - game-servers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      fishmmo_internal:
        aliases:
          - worldserver
    ports:
      - "127.0.0.1:7780:7780/udp"
    volumes:
      - game_logs:/var/log/fishmmo
      - nginx_certs:/etc/fishmmo/certs:ro
    environment:
      ConnectionStrings__NpgsqlConnection: ${ConnectionStrings__NpgsqlConnection}
      FISHMMO_ENVIRONMENT: Production
      ServerName: WorldServer
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # Scene Server (Placeholder)
  # ═════════════════════════════════════════════════════════════════
  scene-server:
    image: fishmmo/scene-server:latest
    container_name: fishmmo-scene
    build:
      context: ../FishMMO-Unity
      dockerfile: Dockerfile.scene
    profiles:
      - all
      - game-servers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      fishmmo_internal:
        aliases:
          - sceneserver
    ports:
      - "127.0.0.1:7790:7790/udp"
    volumes:
      - game_logs:/var/log/fishmmo
      - nginx_certs:/etc/fishmmo/certs:ro
    environment:
      ConnectionStrings__NpgsqlConnection: ${ConnectionStrings__NpgsqlConnection}
      FISHMMO_ENVIRONMENT: Production
      ServerName: SceneServer
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      world-server:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═════════════════════════════════════════════════════════════════
  # Certbot — Let's Encrypt TLS Certificate Renewal
  # ═════════════════════════════════════════════════════════════════
  certbot:
    image: certbot/certbot:latest
    container_name: fishmmo-certbot
    profiles:
      - all
      - certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      fishmmo_public: {}
    volumes:
      - nginx_certs:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
