ServerName=LoginServer
MaximumClients=4000
# Bind address. 127.0.0.1 = loopback (all traffic through nginx proxy).
# Set to 0.0.0.0 to bind all interfaces if nginx is on a different machine.
Address=127.0.0.1
Port=7770
StaleSceneTimeout=5
# IPv6 dual-stack is NOT currently supported at the native QUIC layer.
# IPv6 clients must connect through an IPv6-enabled NGINX L4 proxy.
# EnableIPv6 and IPv6Address are reserved for future implementation.
# EnableIPv6=false
# IPv6Address=::1
# WARNING: Do NOT copy AutoVerifyAccounts=true to production.
# In production, accounts must require email verification before allowing login.
# Set to false (or remove this line) and configure SMTP for email verification.
AutoVerifyAccounts=true
# ── TLS Certificate Configuration ─────────────────────────────
# PEM certificate and private key for QUIC/TLS termination.
# Each game server terminates its own TLS (NGINX forwards raw UDP).
# Paths are fully configurable — set per platform and certificate source.
# Linux:   /etc/fishmmo/certs/fullchain.pem
# Windows: C:\ProgramData\FishMMO\certs\fullchain.pem
# macOS:   /usr/local/share/fishmmo/certs/fullchain.pem
CertificatePath=/etc/fishmmo/certs/fullchain.pem
PrivateKeyPath=/etc/fishmmo/certs/privkey.pem
# ── Connection Token HMAC Key ─────────────────────────────────
# Base64-encoded 32+ byte key for stateless connection token signing/verification.
# MUST match the key configured on the IpFetchServer (ConnectionToken:HmacKey).
# Generate with: openssl rand -base64 32
# Can also be set via FISHMMO_CONNECTION_TOKEN_HMAC_KEY_BASE64 env var.
ConnectionTokenHmacKeyBase64=
# ── SMTP Email Configuration ───────────────────────────────────
# Used by AccountCreationSystem to send verification emails.
# Can be overridden by environment variables:
#   FISHMMO_SMTP_HOST, FISHMMO_SMTP_PORT, FISHMMO_SMTP_USERNAME,
#   FISHMMO_SMTP_PASSWORD, FISHMMO_SMTP_FROM_ADDRESS,
#   FISHMMO_SMTP_FROM_NAME, FISHMMO_SMTP_USE_SSL
Smtp:Host=localhost
Smtp:Port=587
Smtp:Username=
Smtp:Password=
Smtp:FromAddress=noreply@fishmmo.com
Smtp:FromName=FishMMO
# UseSsl=false is fine for local testing with a local SMTP relay.
# Production deployments must set this to true.
Smtp:UseSsl=false
# ── Login Queue Configuration ──────────────────────────────────
# Update rate in seconds — how often queued clients receive position updates.
# Server-controlled; clients cannot request faster updates.
LoginQueueUpdateRateSeconds=2.0
# Maximum clients allowed in the login queue. Excess clients are rejected outright.
LoginQueueMaxSize=500
# Maximum rate at which clients are admitted from the queue (per second).
LoginQueueAdmissionRatePerSecond=5.0
# Maximum seconds a client may wait in the queue before being timed out.
LoginQueueTimeoutSeconds=300
