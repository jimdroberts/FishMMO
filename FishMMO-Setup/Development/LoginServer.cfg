ServerName=LoginServer
MaximumClients=4000
# Bind address. 127.0.0.1 = loopback (all traffic through nginx proxy).
# Set to 0.0.0.0 to bind all interfaces if nginx is on a different machine.
Address=127.0.0.1
Port=7770
StaleSceneTimeout=5
# IPv6 dual-stack is NOT currently supported at the native QUIC layer.
# IPv6 clients must connect through an IPv6-enabled NGINX L4 proxy.
# EnableIPv6 and IPv6Address are reserved for future implementation.
# EnableIPv6=false
# IPv6Address=::1
# !!! WARNING: DO NOT COPY TO PRODUCTION !!!
# AutoVerifyAccounts=true bypasses email verification for all accounts.
# In production, accounts must require email verification before allowing login.
# Set to false (or remove this line) and configure SMTP for email verification.
# !!! WARNING: DO NOT COPY TO PRODUCTION !!!
AutoVerifyAccounts=true
# ── Account Verification Channels ─────────────────────────────
# At registration a player chooses to verify by email, by SMS, by a Discord message, or any mix
# (SMS needs a phone number, Discord a Discord username). A code goes out on each chosen channel
# this server switches on, and ANY ONE code verifies the account.
# Precedence, highest first:
#   1. AutoVerifyAccounts=true (editor and development builds ONLY; a production build ignores
#      it, and refuses to start with it set) verifies every account at creation: no code is
#      sent and authenticator (two-factor) enrolment is skipped.
#   2. VerifyEmail / VerifySms / VerifyDiscord say which channels this server sends codes on.
#      With ALL THREE false every new account is verified at creation (no code sent) but is
#      still enrolled in two-factor authentication.
#   3. Otherwise a code is sent on each chosen channel that is switched on; a player whose
#      choices are all switched off is sent an email code instead. There is no grace period:
#      an unverified account cannot sign in until it enters a code, and three incorrect codes
#      in a row open a support ticket for the account.
# Sign-in applies the same switches, and the Control Panel's Verification section must match.
# A missing or unreadable value counts as true.
VerifyEmail=true
# SMS codes are queued in sms_queue and sent by the Control Panel. No SMS provider exists yet
# and the panel's drain only logs, so in development read the code from the panel's log.
VerifySms=true
# Discord codes are delivered once, as a direct message, by FishMMO-DiscordBot running against
# this database with Discord:DefaultGuildId set to the server players are invited to. A player
# who is not in that server yet is sent the message when they join. It is never re-sent.
VerifyDiscord=true
# ── Closed Test (Beta Mode) ───────────────────────────────────
# BetaMode=true gates BOTH account creation and sign-in:
#   - Creating an account requires a beta code redeemable for one of BetaPrograms. It is
#     checked before the account exists and redeemed straight after; the link is permanent.
#     Every bad code gets the same refusal.
#   - Sign-in, only AFTER the password is proven, refuses any account below GameMaster that
#     holds no un-revoked code of one of BetaPrograms. Staff are never refused. Players can
#     redeem a code later in the Control Panel.
# BetaPrograms is a comma-separated list of program keys (1-32 of a-z 0-9 _ -, case-insensitive),
# e.g. BetaPrograms=closed_beta,private_test. BetaMode=true with no valid program admits
# nobody below GameMaster. A code entered while BetaMode=false is still redeemed, for later.
BetaMode=false
BetaPrograms=
# ── Sign-in Lockout (shared with the Control Panel) ───────────
# Failures are counted on the account row, so every login server and the Control Panel lock
# an account together. Keep these equal to the panel's values; the defaults are the shared
# policy. They sit on top of the per-process limits built into the login server.
# Password: Threshold wrong passwords within WindowMinutes lock password sign-in for
#   LockMinutes. A locked account is answered exactly like a wrong password.
AuthLockoutPasswordThreshold=5
AuthLockoutPasswordWindowMinutes=15
AuthLockoutPasswordLockMinutes=15
# TwoFactor: the same for wrong authenticator or recovery codes. The password is already
#   proven at that step, so the player is told the step is locked and for how long.
AuthLockoutTwoFactorThreshold=5
AuthLockoutTwoFactorWindowMinutes=15
AuthLockoutTwoFactorLockMinutes=30
# ── TLS Certificate Configuration ─────────────────────────────
# PEM certificate and private key for QUIC/TLS termination.
# Each game server terminates its own TLS (NGINX forwards raw UDP).
# Paths are fully configurable — set per platform and certificate source.
# Linux:   /etc/fishmmo/certs/fullchain.pem
# Windows: C:\ProgramData\FishMMO\certs\fullchain.pem
# macOS:   /usr/local/share/fishmmo/certs/fullchain.pem
CertificatePath=/etc/fishmmo/certs/fullchain.pem
PrivateKeyPath=/etc/fishmmo/certs/privkey.pem
# ── Browser WebTransport CORS ─────────────────────────────────
# Comma-separated list of allowed Origin header values for browser
# WebTransport connections (e.g. "https://play.fishmmo.com").
# Empty or commented out = allow all origins (development only).
# In production, set to your WebGL client's origin.
# AllowedOrigins=https://play.fishmmo.com
# ── Connection Token HMAC Key ─────────────────────────────────
# Base64-encoded 32+ byte key for stateless connection token signing/verification.
# MUST match the key configured on the IpFetchServer (ConnectionToken:HmacKey).
# Generate with: openssl rand -base64 32
# Connection token HMAC keys are loaded from the connection_token_keys database table.
ConnectionTokenHmacKeyBase64=
# ── SMTP ───────────────────────────────────────────────────────
# Used ONLY to send mail this server has ENQUEUED. Account creation still happens here and
# still queues verification mail — but the Control Panel drains the queue and does the
# sending, so these settings are inert unless Smtp:DrainQueue is turned on below.
#
# TLS, stated for THIS sender (System.Net.Mail.SmtpClient):
#   UseSsl=true sets EnableSsl, which performs STARTTLS on port 587. That is the setting
#   you want for every hosted relay.
#   Port 465 (implicit TLS) is NOT supported by this client. Do not use it.
#   UseSsl=false means no TLS at all and sends the relay password in the clear.
#
# The password is a live sending credential and does NOT belong in this file, which ships
# in the repository. Put it in /etc/fishmmo/db-secrets.env as FISHMMO_SMTP_PASSWORD; the
# environment is read first and game servers inherit it from the daemon.
#
# Can be overridden by environment variables:
#   FISHMMO_SMTP_HOST, FISHMMO_SMTP_PORT, FISHMMO_SMTP_USERNAME,
#   FISHMMO_SMTP_PASSWORD, FISHMMO_SMTP_FROM_ADDRESS,
#   FISHMMO_SMTP_FROM_NAME, FISHMMO_SMTP_USE_SSL
Smtp:Host=localhost
Smtp:Port=587
Smtp:Username=
Smtp:Password=
Smtp:FromAddress=noreply@fishmmo.com
Smtp:FromName=FishMMO
Smtp:UseSsl=false
# Whether THIS server drains the outbound email queue and sends the mail.
# Off: the Control Panel does it, on a real background service instead of a game tick.
# Turn it on only for a deployment that runs no Control Panel.
Smtp:DrainQueue=false
# ── Login Queue Configuration ──────────────────────────────────
# Connections allowed to be signing in at once (handshake done, not yet authenticated; a
# player at the two-factor prompt does not count, though the whole set, prompts included, is
# held to ten times this). A handshake past it joins the login queue below, so this is
# the queue's threshold. Unset, it is what the SRP verify and proof channels hold between
# them (AuthSrpVerifyChannelCapacity + AuthSrpProofChannelCapacity, 500 + 500 = 1000): past
# that, admitting more connections only risks the channels refusing them with ServerBusy,
# while the queue keeps their place. Set it only to override that.
# AuthMaxPendingConnections=1000
# Update rate in seconds — how often queued clients receive position updates.
# Server-controlled; clients cannot request faster updates.
LoginQueueUpdateRateSeconds=2.0
# Maximum clients allowed in the login queue. Excess clients are rejected outright.
LoginQueueMaxSize=500
# Maximum rate at which clients are admitted from the queue (per second). 50 sits under what
# the SRP pipeline completes (the proof stage, near 100/s on the default two workers), so the
# queue drains into it without refilling the cap. Kept within 0.1-100.
LoginQueueAdmissionRatePerSecond=50.0
# Maximum seconds a client may wait in the queue before being timed out.
LoginQueueTimeoutSeconds=300
