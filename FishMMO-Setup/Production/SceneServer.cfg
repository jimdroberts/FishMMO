ServerName=Scene Server
MaximumClients=4000
# Bind address. 127.0.0.1 = loopback (all traffic through nginx proxy).
# Set to 0.0.0.0 to bind all interfaces if nginx is on a different machine.
Address=127.0.0.1
Port=7790
# IPv6 dual-stack is NOT currently supported at the native QUIC layer.
# IPv6 clients must connect through an IPv6-enabled NGINX L4 proxy.
# EnableIPv6 and IPv6Address are reserved for future implementation.
# EnableIPv6=false
# IPv6Address=::1
StaleSceneTimeout=5
# ── TLS Certificate Configuration ─────────────────────────────
# PEM certificate and private key for QUIC/TLS termination.
# Each game server terminates its own TLS (NGINX forwards raw UDP).
CertificatePath=/etc/fishmmo/certs/fullchain.pem
PrivateKeyPath=/etc/fishmmo/certs/privkey.pem
# ── Connection Token HMAC Key ─────────────────────────────────
# Base64-encoded 32+ byte key for stateless connection token signing/verification.
# MUST match the key configured on the IpFetchServer (ConnectionToken:HmacKey).
# Generate with: openssl rand -base64 32
# Can also be set via FISHMMO_CONNECTION_TOKEN_HMAC_KEY_BASE64 env var.
ConnectionTokenHmacKeyBase64=${FISHMMO_CONNECTION_TOKEN_HMAC_KEY_BASE64}
