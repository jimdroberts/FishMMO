ServerName=Scene Server
MaximumClients=4000
# Bind address. 127.0.0.1 = loopback (all traffic through nginx proxy).
# Set to 0.0.0.0 to bind all interfaces if nginx is on a different machine.
Address=127.0.0.1
Port=7790
# IPv6 dual-stack is NOT currently supported at the native QUIC layer.
# IPv6 clients must connect through an IPv6-enabled NGINX L4 proxy.
# EnableIPv6 and IPv6Address are reserved for future implementation.
# EnableIPv6=false
# IPv6Address=::1
# Minutes an empty OPEN WORLD scene instance stays loaded before it is unloaded and its
# scene row deleted. Shared zones are expensive to boot and likely to be wanted again.
StaleSceneTimeout=5
# Minutes an empty Group/PvP (instanced) scene stays loaded. Deliberately shorter than
# StaleSceneTimeout: a dungeon instance belongs to one character or party, so once it
# empties it is unlikely to be wanted again, and each one holds a full physics scene.
# Long enough to survive a wipe-and-run-back or a relog, which is all it has to cover.
StaleInstanceSceneTimeout=2
# Scene handshake watchdog: a client that claimed a character must finish loading into the world.
# The client sends a heartbeat every 5 s while loading. It is disconnected after this many seconds
# without one (an older client without heartbeats gets this long in total; minimum 30)...
SceneLoadStallTimeoutSeconds=120
# ...or after this many seconds of loading in total, heartbeats or not (minimum: the stall limit).
# Generous on purpose: a first web visit downloads the world's content, and slow hardware or a slow
# connection must not be cut off.
SceneLoadMaxSeconds=900
# Traffic breakdown: every this many seconds, log each player's outbound game data by message type (broadcast types,
# behaviours' RPCs and sync types, prediction state updates, spawns) in B/s and messages/s. A measuring tool for the
# bandwidth budget; 0 = off. Cheap, but leave it off in normal running.
TrafficBreakdownSeconds=60
# Network send schedule: the simulation always ticks every tick (30 Hz); these say how often data is FLUSHED.
# 2 = every second tick: each packet carries two ticks of messages (each on its own tick, via FishNet tick markers), so
# half the packets and half the per-packet header cost. The server tells each client its ClientNetworkSendInterval on
# arrival, and deepens its input queue by one tick per extra tick of client interval so inputs arriving in pairs never
# leave it empty. Allowed: 1 or 2 (1 = every tick, FishNet's own behaviour; the code default when a key is absent).
NetworkSendInterval=2
ClientNetworkSendInterval=2
# A player nowhere near a fight (no target, not in combat, nobody in combat within reach) has its unreliable data flushed
# this often instead: fewer packets, everything one tick later. Reliable data (replies, loot, chat) still leaves on
# NetworkSendInterval, and a player goes back to it the tick it deals or takes damage, held 3 s after. 0 = off; at most 3.
IdleNetworkSendInterval=3
# Observer byte budget: bytes per second each player may spend on observed characters' movement updates. Characters are
# admitted in relevance order at the slowest rate first (visibility before fidelity), then upgraded with what is left;
# the least relevant drop out of view when even that does not fit. Party, target and anyone in a fight with the player are
# never dropped, and characters within reach of the player's abilities are never slowed. 0 = off.
ObserverByteBudget=2000
# Estimated bytes of one movement update (read the real figure off the traffic breakdown's NetworkTransform rows).
ObserverUpdateCostBytes=16
# Share of a moving character's cost charged for one standing still (a still transform sends nothing once settled).
ObserverIdleCostShare=0.1
# ── TLS Certificate Configuration ─────────────────────────────
# PEM certificate and private key for QUIC/TLS termination.
# Each game server terminates its own TLS (NGINX forwards raw UDP).
CertificatePath=/etc/fishmmo/certs/fullchain.pem
PrivateKeyPath=/etc/fishmmo/certs/privkey.pem
# ── Connection Token HMAC Key ─────────────────────────────────
# ConnectionTokenHmacKeyBase64 is loaded from the connection_token_keys database table at runtime. Leave empty here.
# Base64-encoded 32+ byte key for stateless connection token signing/verification.
# MUST match the key configured on the IpFetchServer (ConnectionToken:HmacKey).
# Generate with: openssl rand -base64 32
# Connection token HMAC keys are loaded from the connection_token_keys database table.
ConnectionTokenHmacKeyBase64=
