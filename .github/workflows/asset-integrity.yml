name: Asset integrity

# Text-level checks over Unity assets. No Unity license needed, so this runs on every fork PR.
on:
  push:
    paths:
      - 'FishMMO-Unity/Assets/**/*.prefab'
      - 'FishMMO-Unity/Assets/**/*.unity'
      - 'scripts/check-network-bindings.sh'
      - '.github/workflows/asset-integrity.yml'
  pull_request:
    paths:
      - 'FishMMO-Unity/Assets/**/*.prefab'
      - 'FishMMO-Unity/Assets/**/*.unity'
      - 'scripts/check-network-bindings.sh'
      - '.github/workflows/asset-integrity.yml'

jobs:
  network-object-bindings:
    name: NetworkObject bindings are local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every networked component is bound to its own asset
        run: scripts/check-network-bindings.sh
